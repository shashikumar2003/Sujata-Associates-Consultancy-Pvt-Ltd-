<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sujata Associates</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- Hero -->
    <section class="bg-gradient-to-r from-green-600 to-teal-600 text-white py-20 text-center">
        <h1 class="text-4xl md:text-5xl font-bold">Contact Us</h1>
        <p class="mt-4 text-lg max-w-2xl mx-auto">
            We're here to help you with company registration, compliance, and legal services.
        </p>
    </section>

    <!-- Contact Form + Info -->
    <section class="py-16 px-6 md:px-12 max-w-6xl mx-auto grid md:grid-cols-2 gap-12">

        <!-- Contact Form -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-semibold text-green-600 mb-6">Send Us a Message</h2>
            <form action="#" method="POST" class="space-y-4">
                <input type="text" placeholder="Your Name"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-600 outline-none">
                <input type="email" placeholder="Your Email"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-600 outline-none">
                <input type="text" placeholder="Your Phone"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-600 outline-none">
                <textarea rows="5" placeholder="Your Message"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-600 outline-none"></textarea>
                <button type="submit"
                    class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                    Submit
                </button>
            </form>
        </div>

        <!-- Contact Info -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-semibold text-green-600 mb-6">Our Contact Info</h2>
            <p class="text-gray-700 mb-4"><strong>Office Address:</strong><br>
                123 Business Park, Mumbai, India</p>
            <p class="text-gray-700 mb-4"><strong>Email:</strong> support@sujataassociates.com</p>
            <p class="text-gray-700 mb-4"><strong>Phone:</strong> +91 98765 43210</p>

            <iframe class="w-full h-64 rounded-lg mt-6" src="https://www.google.com/maps/embed?pb=!1m18!..."
                allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>

</body>

</html>
